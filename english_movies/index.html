<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>English Movies</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 52px 20px 20px;
      background: linear-gradient(180deg, #111 0%, #0d0d0d 100%);
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #e8b84b;
      letter-spacing: 0.3px;
    }

    header p {
      font-size: 14px;
      color: #555;
      margin-top: 6px;
    }

    .section-title {
      padding: 20px 20px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .movies {
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .movie-card {
      background: #1a1a1a;
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid #2a2a2a;
      transition: background 0.15s;
      cursor: pointer;
    }

    .movie-card:active { background: #222; }

    .movie-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e8b84b22, #e8b84b44);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .movie-info { flex: 1; min-width: 0; }

    .movie-info h2 {
      font-size: 16px;
      font-weight: 600;
      color: #f0f0f0;
    }

    .movie-info p {
      font-size: 13px;
      color: #555;
      margin-top: 3px;
    }

    .movie-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .badge {
      background: #e8b84b1a;
      color: #e8b84b;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.analyzed {
      background: #4bae8a1a;
      color: #4bae8a;
    }

    .chevron {
      color: #333;
      font-size: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>English Movies</h1>
    <p>Tap a line while watching to get instant analysis</p>
  </header>

  <div class="section-title">Available scripts</div>

  <div class="movies">
    <a href="viewer.html?movie=patch_adams" class="movie-card">
      <div class="movie-thumb">🎬</div>
      <div class="movie-info">
        <h2>Patch Adams</h2>
        <p>1998 · Drama / Comedy · Robin Williams</p>
        <div class="movie-meta">
          <span class="badge">74 lines</span>
          <span class="badge analyzed">15 analyzed</span>
        </div>
      </div>
      <span class="chevron">›</span>
    </a>
  </div>
</body>
</html>
